- aid: etsi:openslice-tmforum-open-apis
  name: ETSI OpenSlice TM Forum Open APIs
  description: ETSI SDG OpenSlice is an open-source service-based OSS delivering Network as a Service,
    and it exposes its catalog, ordering and inventory surface as TM Forum Open APIs. The documentation
    lists more than twenty exposed endpoints including TMF620 Product Catalog, TMF622 Product Ordering,
    TMF629 Customer, TMF632 Party, TMF633 Service Catalog, TMF634 Resource Catalog, TMF638 Service Inventory,
    TMF639 Resource Inventory, TMF640 Service Activation, TMF641 Service Ordering, TMF642 Alarm, TMF651
    Agreement, TMF652 Resource Ordering, TMF653 Service Test, TMF657 Service Quality, TMF666 Account,
    TMF669 Party Role, TMF685 Resource Pool and TMF691 Federated ID. The public OpenSlice demo answers
    these paths anonymously; ETSI does not hold a TM Forum Open API conformance certification for them.

  description: The ETSI Software Development Group implementation of the 3GPP Common API Framework, TS
    29.222. Harvested here are the API Invoker Management, API Provider Management, Access Control Policy
    and Auditing service APIs — the northbound framework a mobile operator uses to onboard API invokers,

- aid: etsi:mec-sandbox-edgenative-connector
  name: ETSI MEC Sandbox / EdgeNative Connector
  description: A hosted, free interactive environment where developers exercise live ETSI MEC service
    APIs against emulated 4G, 5G and Wi-Fi network scenarios with moving user equipment. It serves MEC
    011, MEC 012, MEC 013, MEC 021, MEC 028, MEC 030 and MEC 040 through a Swagger UI try-it console,
    and version 1.10 added alignment with 3GPP CAPIF and initial 3GPP EDGEAPP support. The web front end
    loads anonymously but the API paths themselves return HTTP 401 until you sign in, so it is free-but-account-gated
    rather than open.
  humanURL: https://try-mec.etsi.org/
  baseURL: https://try-mec.etsi.org
  tags:
  - Edge Computing

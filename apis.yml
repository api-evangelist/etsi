- aid: etsi:openslice-camara-qod-provisioning
  name: ETSI OpenSlice CAMARA-as-a-Service QoD Provisioning API
  description: 'A CAMARA Quality on Demand (QoD) Provisioning API implementation shipped as an add-on
    to ETSI OpenSlice. It wraps a running TM Forum service inventory entry so an operator can expose an
    existing 5G core or network slice through a standard CAMARA endpoint: set, retrieve and delete a device
    QoS profile. Security is declared as OpenID Connect, matching the CAMARA authorisation model; no CIBA
    grant is declared in this document.'

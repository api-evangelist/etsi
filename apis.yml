aid: etsi
url: https://raw.githubusercontent.com/api-evangelist/etsi/refs/heads/main/apis.yml
name: ETSI
kind: company
description: 'ETSI, the European Telecommunications Standards Institute, is a not-for-profit standards
  development organisation headquartered in Sophia Antipolis, France, and one of only three bodies officially
  recognised by the European Union as a European Standards Organisation. With over 900 member organisations
  from more than 60 countries it standardises ICT across mobile, fixed, broadcast, IoT, security and emerging
  technologies, and it hosts the 3GPP Mobile Competence Centre. In the telecom value chain ETSI sits upstream
  of every operator and vendor: it does not run a network or sell connectivity, it writes the specifications
  that the network is built from. Its API posture is unusually open for a standards body. Every ETSI deliverable
  is downloadable free of charge without login from etsi.org/deliver, and the machine-readable API artefacts
  are published as BSD-3-Clause OpenAPI on two public GitLab instances, forge.etsi.org and labs.etsi.org,
  both of which serve an anonymous REST API. From those ETSI publishes the ISG MEC edge service APIs,
  the NFV SOL lifecycle and orchestration APIs, the ISG CIM NGSI-LD context information API, and open-source
  implementations including OpenCAPIF for 3GPP CAPIF, OpenSlice for TM Forum Open APIs, and an Operator
  Platform Open Exposure Gateway that exposes northbound CAMARA APIs. What is member-gated is participation,
  not publication: portal.etsi.org, working documents, drafting and voting sit behind ETSI membership,
  while the finished standards and their OpenAPI are open to anyone. ETSI itself is not a GSMA Open Gateway
  operator and not a CAMARA member organisation; it reaches CAMARA through liaison and through its own
  open-source code.'

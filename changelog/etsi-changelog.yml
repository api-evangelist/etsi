method: searched
source: >-
  git tag history of the ETSI Forge GitLab projects that hold each OpenAPI, queried anonymously
  through https://forge.etsi.org/rep/api/v4/projects/<project>/repository/tags
note: >-
  ETSI publishes no dated changelog page for its API artefacts. The authoritative change record
  is the tag history of each spec repository on ETSI Forge, where the tag name is the ETSI
  deliverable version (V<major>.<technical>.<editorial>) and the tag date is when the approved
  version was published to Forge. That history is captured here per specification family. ETSI
  news and press releases at https://www.etsi.org/newsroom/ cover organisational and standards
  announcements rather than API changes.
scheme: etsi-deliverable-version
scheme_format: V<major>.<technical>.<editorial>

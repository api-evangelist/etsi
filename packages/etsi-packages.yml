summary: >-
  ETSI is a standards development organisation, not an API operator, so there is no
  "ETSI SDK" for the standards themselves — MEC, NFV SOL and NGSI-LD are protocols that
  implementers generate their own clients from. Exactly one first-party client library is
  published to a public registry: the OpenCAPIF Python SDK, developed inside the ETSI OCF
  Software Development Group at labs.etsi.org/rep/ocf/sdk and shipped to PyPI. Everything
  else that carries an ETSI standard name on npm or PyPI is third-party (FIWARE, Orange,
  Itential, community Node-RED nodes) and is recorded below as such.
packages:
- language: python
  registry: pypi
  name: opencapif-sdk
  url: https://pypi.org/project/opencapif-sdk/
  install: pip install opencapif-sdk
  version_seen: 0.1.24
  repository: https://labs.etsi.org/rep/ocf/sdk
  official: true
  api: etsi:opencapif
  description: >-
    Python SDK for connecting to OpenCAPIF, the ETSI SDG implementation of the 3GPP Common API
    Framework (TS 29.222). Handles invoker onboarding, provider registration, service discovery
    and the security/token flow. Originally developed in the 6G-SANDBOX project and maintained
    in the ETSI OCF GitLab group.

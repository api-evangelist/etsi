summary: >-
  ETSI publishes no MCP server for the MEC / NFV SOL / NGSI-LD standards themselves. It does
  operate two live MCP endpoints — the GitLab-native MCP servers on the two ETSI GitLab
  instances that host every machine-readable ETSI artefact. Both are advertised in RFC 9728
  protected-resource metadata and both answer, so an agent can be pointed at ETSI Forge or ETSI
  Labs with an OAuth token and browse/search the ETSI specification repositories through MCP.
  tools/list is auth-gated (HTTP 401 anonymously), so no tool inputSchemas are captured here;
  they require an authenticated introspection with the `mcp` scope.
servers:
- name: etsi-forge-gitlab
  transport: http
  url: https://forge.etsi.org/rep/api/v4/mcp
  status: published
  provider: GitLab (self-hosted by ETSI)
  authorization_server: https://forge.etsi.org/rep
  required_scopes: [mcp]
  protected_resource_metadata: well-known/etsi-forge-oauth-protected-resource.json
  probe:
    method: 'POST tools/list (jsonrpc 2.0)'
    status: 401
    body: '{"message":"401 Unauthorized"}'
    note: endpoint exists and requires a token; a 404 would have meant no server
  covers: >-
    the ETSI Forge repositories — ISG MEC service APIs, NFV SOL002/003/005/009/011/012 and

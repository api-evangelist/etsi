summary: >-
  ETSI is the rare case where the MCP surface and the OpenAPI surface do not project the same
  data core at all. The two live MCP servers are the GitLab-native ones on forge.etsi.org and
  labs.etsi.org — they expose the *repositories that hold the specifications*, not the
  specifications' own operations. Every one of the 1,244 REST operations harvested here is
  therefore rest_only, and every MCP tool is mcp_only. That divergence is the finding, not a gap
  to paper over: an agent can use MCP to find and read an ETSI standard, and must use the
  OpenAPI to actually call an implementation of it.

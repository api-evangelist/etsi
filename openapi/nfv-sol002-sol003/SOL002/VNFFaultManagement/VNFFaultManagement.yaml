          $ref: ../../responses/SOL002SOL003_resp.yaml#/components/responses/504

  /subscriptions:
    parameters:
      - $ref: ../../components/SOL002_params.yaml#/components/parameters/Version
      - $ref: ../../components/SOL002_params.yaml#/components/parameters/Authorization

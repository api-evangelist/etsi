  PmJobCriteria:
    description: >
      This type represents collection criteria for PM jobs. 
      It shall comply with the provisions defined in Table 7.5.3.3-1.

      NOTE 1:	At the end of each reportingPeriod, the API producer
      inform the API consumer about availability of the performance data
      collected for each completed collection period during this reportingPeriod.
      The reportingPeriod should be equal to or a multiple of the collectionPeriod.
      In the latter case, the performance data for the collection periods within one.

      NOTE 2:	In particular when choosing short collection and reporting periods, the number
      of PM jobs that can be supported depends on the capability of the producing entity.
      reporting period are reported together.
    type: object
    required:
      - collectionPeriod
      - reportingPeriod
    properties:
      performanceMetric:
        description: >
          This defines the types of performance metrics
          for the specified object instances. Valid values are specified
          as "Measurement Name" values in clause 7.3 of ETSI GS NFV-IFA 027.
          At least one of the two attributes (performance metric or group)
          shall be present.
        type: array
        items:
          $ref: "../../definitions/SOL005_def.yaml#/definitions/String"
      performanceMetricGroup:
        description: >
          Group of performance metrics.
          A metric group is a pre-defined list of metrics,
          known to the API producer that it can decompose to
          individual metrics. Valid values are specified as
          "Measurement Group" values in clause 7.3 of ETSI
          GS NFV-IFA 027. At least one of the two attributes
          (performance metric or group) shall be present.
        type: array
        items:
          $ref: "../../definitions/SOL005_def.yaml#/definitions/String"
      collectionPeriod:
        description: >
          Specifies the periodicity at which the API producer
          will collect performance information. The unit
          shall be seconds. See note 1 and note 2.
        type: integer
        minimum: 0
        default: 0
      reportingPeriod:
        description: >
          Specifies the periodicity at which the API producer
          will report to the API consumer.
          about performance information. The unit shall be seconds.
          See note 1 and note 2.
        type: integer
        minimum: 0
        default: 0
      reportingBoundary:
        description: >
          Identifies a time boundary after which the
          reporting will stop. The boundary shall allow a
          single reporting as well as periodic reporting up
          to the boundary.
        $ref: "../../definitions/SOL005_def.yaml#/definitions/DateTime"

  ThresholdCriteria:
    description: >
      This type represents criteria that define a threshold.
      NOTE 1:	In the present document, simple thresholds are defined.
      The definition of additional threshold types is left for future specification.
      NOTE 2:	The hysteresis is defined to prevent storms of threshold
      crossing notifications. When processing a request to create a threshold,
      implementations should enforce a suitable minimum value for this attribute
      (e.g. override the value or reject the request).
    type: object
    required:
      - performanceMetric
      - thresholdType
    properties:
      performanceMetric:
        description: >
          Defines the performance metric associated with the
          threshold. Valid values are specified as "Measurement Name"
          values in clause 7.2 of ETSI GS NFV IFA 027.
        type: string
      thresholdType:
        description: >
          Type of threshold. This attribute determines which other attributes
          are present in the data structure.
          Permitted values:
          * SIMPLE: Single-valued static threshold
          See note 1.
        type: string
        enum:
          - SIMPLE
      simpleThresholdDetails:
        description: >
          Details of a simple threshold. Shall be present if
          thresholdType="SIMPLE".
        type: object
        required:
          - thresholdValue
          - hysteresis
        properties:
          thresholdValue:
            description: >
              The threshold value. Shall be represented as a floating point
              number.               
            type: integer
          hysteresis:
            description: >
              The hysteresis of the threshold. Shall be represented as a
              non-negative floating point number.
              A notification with crossing direction "UP" will be generated if
              the measured value reaches or exceeds
              "thresholdValue" + "hysteresis". A notification with crossing
              direction "DOWN" will be generated if the measured value reaches
              or undercuts "thresholdValue" - "hysteresis".
              See note 2.
            type: integer
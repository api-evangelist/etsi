  CreatePmJobRequest:
    description: >
      This type represents a request to create a PM job. 
      It shall comply with the provisions defined in Table 7.5.2.6-1.
    type: object
    required:
      - objectType
      - objectInstanceIds
      - criteria
      - callbackUri
    properties:
      objectType:
        description: >
          Type of the measured object.
          The applicable measured object type for a measurement
          is defined in clause 7.3 of ETSI GS NFV-IFA 027.
        $ref: "../../definitions/SOL005_def.yaml#/definitions/String"
      objectInstanceIds:
        description: >
          Identifiers of the NS instances for which
          performance information is requested to be collected.
        type: "array"
        items:
          $ref: "../../definitions/SOL005_def.yaml#/definitions/Identifier"
      subObjectInstanceIds:
        description: >
          Identifiers of the sub-object instances of the measured object
          instance for which performance information is requested to be collected.
          May be present if a sub-object is defined in clause 6.2 of ETSI GS NFV-IFA 027
          for the related measured object type.
          If this attribute is present, the cardinality of the "objectInstanceIds"
          attribute shall be 1.
          If this attribute is absent and a sub-object is defined in clause 6.2 of
          ETSI GS NFV IFA 027  for the related measured object type, measurements
          will be taken for all sub-object instances of the measured object instance.
        type: array
        items:
          $ref: "../../definitions/SOL005_def.yaml#/definitions/IdentifierInNs"
      criteria:
        description: >
          Criteria of the collection of performance information.
        $ref: "#/definitions/PmJobCriteria"
      callbackUri:
        description: >
          The URI of the endpoint to send the notification to.
        $ref: "../../definitions/SOL005_def.yaml#/definitions/Uri"
      authentication:
        description: >
          Authentication parameters to configure the use of Authorization
          when sending notifications corresponding to this PM job, as
          defined in clause 8.3.4 of ETSI GS NFV-SOL 013.
          This attribute shall only be present if the API consumer requires
          authorization of notifications.
        $ref: "../../definitions/SOL005_def.yaml#/definitions/SubscriptionAuthentication"

  PmJob:
    description: >
      This type represents a PM job.
    type: object
    required:
      - id
      - objectType
      - objectInstanceIds
      - criteria
      - callbackUri
    properties:
      id:
        description: >
          Identifier of this PM job.
        $ref: "../../definitions/SOL005_def.yaml#/definitions/Identifier"
      objectType:
        description: >
          Type of the measured object.
          The applicable measured object type for a measurement
          is defined in clause 7.3 of ETSI GS NFV-IFA 027.
        $ref: "../../definitions/SOL005_def.yaml#/definitions/String"
      objectInstanceIds:
        description: >
          Identifiers of the NS instances for which
          performance information is collected.
        type: array
        items:
          $ref: "../../definitions/SOL005_def.yaml#/definitions/Identifier"
      subObjectInstanceIds:
        description: >
          Identifiers of the sub-object instances of the measured object
          instance for which performance information is requested to be collected.
          May be present if a sub-object is defined in clause 6.2 of ETSI GS NFV-IFA 027
          for the related measured object type.
          If this attribute is present, the cardinality of the "objectInstanceIds"
          attribute shall be 1.
          If this attribute is absent and a sub-object is defined in clause 6.2 of
          ETSI GS NFV IFA 027  for the related measured object type, measurements
          will be taken for all sub-object instances of the measured object instance.
        type: array
        items:
          $ref: "../../definitions/SOL005_def.yaml#/definitions/IdentifierInNs"
      criteria:
        description: >
          Criteria of the collection of performance information.
        $ref: "#/definitions/PmJobCriteria"
      callbackUri:
        description: >
          The URI of the endpoint to send the notification to.
        $ref: "../../definitions/SOL005_def.yaml#/definitions/Uri"
      reports:
        description: >
          Information about available reports collected by this PM job.
        type: object
        required:
          - href
          - readyTime
          - _links
        properties:
          href:
            description: >
              The Uri where the report can be obtained.
            $ref: "../../definitions/SOL005_def.yaml#/definitions/Uri"
          readyTime:
            description: >
              The time when the report was made available.
            $ref: "../../definitions/SOL005_def.yaml#/definitions/DateTime"
          expiryTime:
            description: >
              The time when the report will expire.
            $ref: "../../definitions/SOL005_def.yaml#/definitions/DateTime"
          fileSize:
            description: >
              The size of the report file in bytes, if known.
            type: integer
          _links:
            description: >
              Links for this resource.
            type: object
            required:
              - self
            properties:
              self:
                description: >
                  URI of this resource.
                $ref: "../../definitions/SOL005_def.yaml#/definitions/Link"
              objects:
                description: >
                  Links to resources representing the measured object
                  instances for which performance information is
                  collected. Shall be present if the measured object instance
                  information is accessible as a resource.
                type: array
                items:
                  $ref: "../../definitions/SOL005_def.yaml#/definitions/Link"

  CreateThresholdRequest:
    description: >
      This type represents a request to create a threshold.
    type: object
    required:
      - objectType
      - objectInstanceId
      - criteria
    properties:
      objectType:
        description: >
          Type of the measured object.
          The applicable measured object type for a measurement
          is defined in clause 7.3 of ETSI GS NFV-IFA 027.
        $ref: "../../definitions/SOL005_def.yaml#/definitions/String"
      objectInstanceId:
        description: >
          Identifier of the NS instance associated with this threshold.
        $ref: "../../definitions/SOL005_def.yaml#/definitions/Identifier"
      subObjectInstanceIds:
        description: >
          Identifiers of the sub-object instances of the measured object
          instance for which performance information is requested to be collected.
          May be present if a sub-object is defined in clause 6.2 of ETSI GS NFV-IFA 027
          for the related measured object type.
          If this attribute is present, the cardinality of the "objectInstanceIds"
          attribute shall be 1.
          If this attribute is absent and a sub-object is defined in clause 6.2 of
          ETSI GS NFV IFA 027  for the related measured object type, measurements
          will be taken for all sub-object instances of the measured object instance.
        type: array
        items:
          $ref: "../../definitions/SOL005_def.yaml#/definitions/IdentifierInNs"
      criteria:
        description: >
          Criteria that define this threshold.
        $ref: "#/definitions/ThresholdCriteria"
      authentication:
        description: >
          Authentication parameters to configure the use of Authorization when
          sending notifications corresponding to this threshold, as defined in
          clause 8.3.4 of ETSI GS NFV-SOL 013.
          This attribute shall only be present if the API consumer requires
          authorization of notifications.
        $ref: "../../definitions/SOL005_def.yaml#/definitions/SubscriptionAuthentication"

  Threshold:
    description: >
      This type represents a threshold.
    type: object
    required:
      - id
      - objectType
      - objectInstanceId
      - criteria
      - callbackUri
      - _links
    properties:
      id:
        description: >
          Identifier of this threshold resource.
        $ref: "../../definitions/SOL005_def.yaml#/definitions/Identifier"
      objectType:
        description: >
          Type of the measured object.
          The applicable measured object type for a measurement
          is defined in clause 7.3 of ETSI GS NFV IFA 027.
      objectInstanceId:
        description: >
          Identifier of the NS instance associated with the threshold.
        $ref: "../../definitions/SOL005_def.yaml#/definitions/Identifier"
      subObjectInstanceIds:
        description: >
          Identifiers of the sub-object instances of the measured
          object instance associated with the threshold.
          May be present if a sub-object is defined in clause 6.2
          of ETSI GS NFV-IFA 027 for the related measurement type.
          If this attribute is absent and a sub-object is defined
          n clause 6.2 of ETSI GS NFV-IFA 027 for the related measured
          object type, measurements will be taken for all sub-object
          instances of the measured object instance.
        type: array
        items:
          $ref: "../../definitions/SOL005_def.yaml#/definitions/IdentifierInNs"
      criteria:
        description: >
          Criteria that define this threshold.
        $ref: "#/definitions/ThresholdCriteria"
      callbackUri:
        description: >
          The URI of the endpoint to send the notification to.
        $ref: "../../definitions/SOL005_def.yaml#/definitions/Uri"
      _links:
        description: >
          Links for this resource.
        type: object
        required:
          - self
        properties:
          self:
            description: >
              URI of this resource.
            $ref: "../../definitions/SOL005_def.yaml#/definitions/Link"
          object:
            description: >
              Link to a resource representing the NS instance for
              which performance information is collected. Shall be
              present if the NS instance information is accessible as
              a resource.

  PerformanceReport:
    description: >
      This type defines the format of a performance report provided by the NFVO
      to the OSS/BSS as a result of collecting
      performance information as part of a PM job.
      The type shall comply with the provisions defined in Table 7.5.2.10-1.
      NOTE:	The sub-object allows to structure the measured object but is not to be confused with sub-counters which allow to structure the measurement value.

      	EXAMPLE:	Measured object:	VnfInstanceXYZ
      		Sub-object:		VnfcInstance1
      		Measurement: 	vCPU_utilization
      		Sub-counters: 	vCPU utilization of each of the vCPUs of VnfcInstance1
      						(vCPU_utilization.vCPU1, vCPU_utilization.vCPU2, etc.).

    type: object
    required:
      - entries
    properties:
      entries:
        description: >
          List of performance information entries. Each
          performance report entry is for a given metric of a given
          object (i.e. NS instance), but can include multiple
          collected values.
        type: array
        items:
          type: object
          required:
            - objectType
            - objectInstanceId
            - performanceMetric
            - performanceValue
          properties:
            objectType:
              description: >
                Type of the measured object.
                The applicable measured object type for a measurement
                is defined in clause 7.3 of ETSI GS NFV-IFA 027.
              $ref: "../../definitions/SOL005_def.yaml#/definitions/String"
            objectInstanceId:
              description: >
                Identifier of the measured object instance for which
                the performance metric is reported.
              $ref: "../../definitions/SOL005_def.yaml#/definitions/Identifier"
            subObjectInstanceId:
              description: >
                Identifier of the sub-object instance of the measured object
                instance for which the performance metric is reported.
                Shall be present if this is required in clause 6.2 of
                ETSI GS NFV-IFA 027 for the related measured object type. See note.
              type: array
              items:
                $ref: "../../definitions/SOL005_def.yaml#/definitions/IdentifierInNs"
            performanceMetric:
              description: >
                Name of the metric collected. This attribute shall contain
                the related "Measurement Name" value as defined in clause
                7.3 of ETSI GS NFV-IFA 027.
              $ref: "../../definitions/SOL005_def.yaml#/definitions/String"
            performanceValues:
              description: >
                List of performance values with associated timestamp.
              type: array
              items:
                type: object
                required:
                  - timeStamp
                  - performanceValue
                properties:
                  timeStamp:
                    description: >
                      Time stamp indicating when the data has been collected.
                    $ref: "../../definitions/SOL005_def.yaml#/definitions/DateTime"
                  value:
                    description: >
                      Value of the metric collected. The type of this attribute shall
                      correspond to the related "Measurement Unit" as defined in clause
                      7.3 of ETSI GS NFV-IFA 027.
                    type: object
                  context:
                    description: >
                      Measurement context information related to the measured value.
                      The set of applicable keys is defined per measurement in the
                      related "Measurement Context" in clause 7.3 of ETSI GS NFV-IFA 027.
                    $ref: "../../definitions/SOL005_def.yaml#/definitions/KeyValuePairs"

  PmJobModifications:
    description: >
      This type represents modifications to a PM job.
      It shall comply with the provisions defined in Table 7.5.2.12-1.
      NOTE:	At least one of the attributes defined in this type shall be present in request bodies.
    type: object
    anyOf:
      - required:
        - callbackUri
      - required:
        - authentication
    properties:
      callbackUri:
        description: >
          New value of the "callbackUri" attribute. The value "null" is not permitted.
          See note.
        $ref: "../../definitions/SOL005_def.yaml#/definitions/Uri"
      authentication:
        description: >
          New value of the "authentication" attribute, or "null" to remove the attribute.
          If present in a request body, these modifications shall be applied according to
          the rules of JSON Merge Patch (see IETF RFC 7396).
          This attribute shall not be present in response bodies.
          See note.
        $ref: "../../definitions/SOL005_def.yaml#/definitions/SubscriptionAuthentication"

  ThresholdModifications:
    description: >
      This type represents modifications to a threshold.
      It shall comply with the provisions defined in Table 7.5.2.11-1.
      NOTE:	At least one of the attributes defined in this type shall be present in request bodies.
    type: object
    anyOf:
      - required:
        - callbackUri
      - required:
        - authentication
    properties:
      callbackUri:
        description: >
          New value of the "callbackUri" attribute. The value "null" is not permitted.
          See note.
        $ref: "../../definitions/SOL005_def.yaml#/definitions/Uri"
      authentication:
        description: >
          New value of the "authentication" attribute, or "null" to remove the attribute.
          If present in a request body, these modifications shall be applied according to
          the rules of JSON Merge Patch (see IETF RFC 7396).
          This attribute shall not be present in response bodies.
          At least one of the attributes defined in this type shall be present in request bodies.
          See note.
        $ref: "../../definitions/SOL005_def.yaml#/definitions/SubscriptionAuthentication"


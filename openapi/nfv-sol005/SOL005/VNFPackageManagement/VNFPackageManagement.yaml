components:
  parameters:
    VnfPkgId:
      name: vnfPkgId
      in: path
      description: |
        Identifier of the VNF package. The identifier is allocated by the NFVO.
      required: true
      style: simple
      explode: false
      schema:
        type: string

    ArtifactPath:
      name: artifactPath
      in: path
      description: |
        For an artifact contained as a file in the VNF package, this variable shall contain a sequence of one or more path
        segments representing the path of the artifact within the VNF package, relative to the root of the package.
        See note 3. EXAMPLE: foo/bar/m%40ster.sh For an external artifact represented as a URI in the VNF package manifest,
        this variable shall contain a sequence of one or more path segments as synthesized by the NFVO (see clause 9.5.3.3),
        representing this artifact. See note 2 and note 3
      required: true
      style: simple
      explode: false
      schema:
        type: string

    SubscriptionId:
      name: subscriptionId
      in: path
      description: |
        Identifier of this subscription. This identifier can be retrieved from the resource referenced by the "Location"
        HTTP header in the response to a POST request creating a new "Individual subscription" resource. It can also be retrieved
        from the "id" attribute in the message content of that response.
      required: true
      style: simple
      explode: false
      schema:
        type: string

  requestBodies:
    VnfPackageCreationRequest:
      description: |
        IndividualVNF package resource creation parameters, as defined in clause 9.5.2.2
      content:
        application/json:
          schema:
            $ref: ./definitions/SOL005VNFPackageManagement_def.yaml#/definitions/CreateVnfPkgInfoRequest
      required: true

    VnfPackageModificationRequest:
      description: |
        Parameters for VNF package information modifications.
      content:
        application/json:
          schema:
            $ref: ./definitions/SOL005VNFPackageManagement_def.yaml#/definitions/VnfPkgInfoModifications
      required: true

    VnfPackageExtArtifactsRequest:
      description: |
        The message content contains the access configuration information based on which the NFVO can obtain the
        external VNF package artifact files.
      content:
        application/json:
          schema:
            $ref: ./definitions/SOL005VNFPackageManagement_def.yaml#/definitions/ExternalArtifactsAccessConfig
      required: true

    VnfPackageContentRequest:
      content:
        application/binary:
          schema:
            properties:
              file:
                type: string
                description: |
                  The message content contains a ZIP file that represents the VNF package. The "Content-Type" HTTP header shall
                  be set according to the type of the file, i.e. to "application/zip" for a VNF Package as defined in ETSI GS NFV-SOL 004.
                format: binary
      required: true

    VnfPackageUploadFromUriRequest:
      description: |
        The message content contains the address information based on which the NFVO can obtain the content of the VNF package.
        The message content contains the address information based on which the NFVO can obtain the content of the VNF package.
      content:
        application/json:
          schema:
            $ref: ./definitions/SOL005VNFPackageManagement_def.yaml#/definitions/UploadVnfPackageFromUriRequest
      required: true

    VnfPkgSubscriptionRequest:
      description: |
        Details of the subscription to be created.
      content:
        application/json:
          schema:
            $ref: ./definitions/SOL005VNFPackageManagement_def.yaml#/definitions/PkgmSubscriptionRequest
      required: true

  responses:
    VnfPackages.Get.200:
      description: |
        200 OK
        Shall be returned when information about zero or more VNF packages has been queried successfully.
        The response body shall contain in an array the VNF package info representations that match the attribute
        filter, i.e. zero or more VNF package info representations as defined in clause 9.5.2.5.
        If the "filter" URI parameter or one of the "all_fields", "fields", "exclude_fields" or "exclude_default"
        URI parameters was supplied in the request and is supported, the data in the response body shall have been
        transformed according to the rules specified in clauses 5.2.2 and 5.3.2 of ETSI GS NFV SOL 013, respectively.
        If the NFVO supports alternative 2 (paging) according to clause 5.4.2.1 of ETSI GS NFV SOL 013 for this
        resource, inclusion of the Link HTTP header in this response shall follow the provisions in clause 5.4.2.3
        of ETSI GS NFV SOL 013.
      headers:
        Version:
          description: |
            Version of the API used in the response.
          style: simple
          explode: false
          schema:
            type: string
        WWW-Authenticate:
          description: |
            Challenge if the corresponding HTTP request has not provided authorization, or error details if the
            corresponding HTTP request has provided an invalid authorization token.
          style: simple
          explode: false
          schema:
            type: string
        Content-Type:
          description: The MIME type of the body of the response.
          style: simple
          explode: false
          schema:
            type: string
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: ./definitions/SOL005VNFPackageManagement_def.yaml#/definitions/VnfPkgInfo

    VnfPackages.Post.201:
      description: |
        201 Created
        Shall be returned when an "Individual VNF package" resource has been created successfully. The response body
        shall contain a representation of the new individual VNF package resource, as defined in clause 9.5.2.5.
        The HTTP response shall include a "Location" HTTP header that contains the resource URI of the individual
        VNF package resource.
      headers:
        Version:
          description: |
            Version of the API used in the response.
          style: simple
          explode: false
          schema:
            type: string
        WWW-Authenticate:
          description: |
            Challenge if the corresponding HTTP request has not provided authorization, or error details if the
            corresponding HTTP request has provided an invalid authorization token.
          style: simple
          explode: false
          schema:
            type: string
        Content-Type:
          description: |
            The MIME type of the body of the response.This header field shall be present if the response has a
            non-empty message body.
          style: simple
          explode: false
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: ./definitions/SOL005VNFPackageManagement_def.yaml#/definitions/VnfPkgInfo

    IndividualVnfPackage.Get.200:
      description: |
        200 OK
        Shall be returned when information of the VNF package has been read successfully. The response body shall
        contain the VNF package info representation defined in clause 9.5.2.5.
      headers:
        Version:
          description: |
            Version of the API used in the response.
          style: simple
          explode: false
          schema:
            type: string
        WWW-Authenticate:
          description: |
            Challenge if the corresponding HTTP request has not provided authorization, or error details if the
            corresponding HTTP request has provided an invalid authorization token.
          style: simple
          explode: false
          schema:
            type: string
        Content-Type:
          description: |
            The MIME type of the body of the response.This header field shall be present if the response has a
            non-empty message body.
          style: simple
          explode: false
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: ./definitions/SOL005VNFPackageManagement_def.yaml#/definitions/VnfPkgInfo

    IndividualVnfPackage.Delete.204:
      description: |
        204 No Content
        The VNF package has been deleted successfully. The response body shall be empty.
      headers:
        Version:
          description: |
            Version of the API used in the response.
          style: simple
          explode: false
          schema:
            type: string
      content: {}

    IndividualVnfPackage.Delete.409:
      description: |
        409 CONFLICT

        Shall be returned upon the following error: The operation cannot be executed currently, due to a conflict with
        the state of the resource.
        Typically, this is due to the fact that the operational state of the VNF package resource is "ENABLED", or the
        usage state is "IN_USE" (i.e. "Individual VNF instance" resource created from the concerned VNF package exists).
        The response body shall contain a ProblemDetails structure, in which the "detail" attribute shall convey more
        information about the error.
      headers:
        Version:
          description: |
            Version of the API used in the response.
          style: simple
          explode: false
          schema:
            type: string
        WWW-Authenticate:
          description: |
            Challenge if the corresponding HTTP request has not provided authorization, or error details if the
            corresponding HTTP request has provided an invalid authorization token.
          style: simple
          explode: false
          schema:
            type: string
        Content-Type:
          description: The MIME type of the body of the response.
          style: simple
          explode: false
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "../definitions/SOL005_def.yaml#/definitions/ProblemDetails"

    IndividualVnfPackage.Patch.200:
      description: |
        200 OK
        Shall be returned when the operation has been completed successfully. The response body shall contain
        attribute modifications for an "Individual VNF package" resource.
      headers:
        Version:
          description: |
            Version of the API used in the response.
          style: simple
          explode: false
          schema:
            type: string
        WWW-Authenticate:
          description: |
            Challenge if the corresponding HTTP request has not provided authorization, or error details if the
            corresponding HTTP request has provided an invalid authorization token.
          style: simple
          explode: false
          schema:
            type: string
        Content-Type:
          description: The MIME type of the body of the response.
          style: simple
          explode: false
          schema:
            type: string
        ETag:
          description: |
            Etag used in the header response.
          style: simple
          explode: false
          schema:
            type: string
        Last-Modified:
          description: |
            Last-modified used in the header response.
          style: simple
          explode: false
          schema:
            type: string
        If-Unmodified-Since:
          description: |
            Response header available in case the related "Last-Modified" or "ETag" headers 
            have been received in previous responses related to the target resource. 
            The API consumer should provide the "If-Unmodified-Since" or the "If-Match" header fields 
            as conditions (see sections 3.1 and 3.4 of IETF RFC 9110). 
          style: simple
          explode: false
          schema:
              type: string
        If-Match:
          description: |
            Response header available in case the related "Last-Modified" or "ETag" headers 
            have been received in previous responses related to the target resource. 
            The API consumer should provide the "If-Unmodified-Since" or the "If-Match" header fields 
            as conditions (see sections 3.1 and 3.4 of IETF RFC 9110). 
          style: simple
          explode: false
          schema:
              type: string
      content:
        application/json:
          schema:
            $ref: ./definitions/SOL005VNFPackageManagement_def.yaml#/definitions/VnfPkgInfoModifications

    IndividualVnfPackage.Patch.409:
      description: |
        409 CONFLICT

        Shall be returned upon the following error: The operation cannot be executed currently,
        due to a conflict with the state of the resource.
        Typically, this is due to any of the following scenarios:
        - Disable a VNF package resource of which the operational state is not "ENABLED"
        - Enable a VNF package resource of which the operational state is not "DISABLED"
        The response body shall contain a ProblemDetails structure, in which the "detail"
        attribute shall convey more information about the error.
      headers:
        Version:
          description: |
            Version of the API used in the response.
          style: simple
          explode: false
          schema:
            type: string
        WWW-Authenticate:
          description: |
            Challenge if the corresponding HTTP request has not provided authorization, or error details if the
            corresponding HTTP request has provided an invalid authorization token.
          style: simple
          explode: false
          schema:
            type: string
        Content-Type:
          description: The MIME type of the body of the response.
          style: simple
          explode: false
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "../definitions/SOL005_def.yaml#/definitions/ProblemDetails"

    IndividualVnfPackageVnfd.Get.200:
      description: |
        200 OK
        Shall be returned when the content of the VNFD has been read successfully. The message content shall contain a
        copy of the file representing the VNFD or a ZIP file that contains the file or multiple files representing
        the VNFD, as specified above. The "Content-Type" HTTP header shall be set according to the format of the
        returned file, i.e. to "text/plain" for a YAML file or to "application/zip" for a ZIP file.
      headers:
        Version:
          description: |
            Version of the API used in the response.
          style: simple
          explode: false
          schema:
            type: string
        WWW-Authenticate:
          description: |
            Challenge if the corresponding HTTP request has not provided authorization, or error details if the
            corresponding HTTP request has provided an invalid authorization token.
          style: simple
          explode: false
          schema:
            type: string
        Content-Type:
          description: The MIME type of the body of the response.
          style: simple
          explode: false
          schema:
            type: string
      content: {}

    IndividualVnfPackageVnfd.Get.409:
      description: |
        409 CONFLICT

        Shall be returned upon the following error: The operation cannot be executed currently, due to a conflict
         with the state of the resource.
        Typically, this is due to the fact that "onboardingState" of the VNF package has a value different from
        "ONBOARDED".
        The response body shall contain a ProblemDetails structure, in which the "detail" attribute shall convey
        more information about the error.
      headers:
        Version:
          description: |
            Version of the API used in the response.
          style: simple
          explode: false
          schema:
            type: string
        WWW-Authenticate:
          description: |
            Challenge if the corresponding HTTP request has not provided authorization, or error details if the
            corresponding HTTP request has provided an invalid authorization token.
          style: simple
          explode: false
          schema:
            type: string
        Content-Type:
          description: The MIME type of the body of the response.
          style: simple
          explode: false
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "../definitions/SOL005_def.yaml#/definitions/ProblemDetails"

    IndividualVnfPackageExtArtifacts.Get.200:
      description: |
        200 OK
        Shall be returned when the access configuration information has been read successfully.
        If no information has been provided previously, an empty array shall be returned.
      headers:
        Version:
          description: |
            Version of the API used in the response.
          style: simple
          explode: false
          schema:
            type: string
        WWW-Authenticate:
          description: |
            Challenge if the corresponding HTTP request has not provided authorization, or error details if the
            corresponding HTTP request has provided an invalid authorization token.
          style: simple
          explode: false
          schema:
            type: string
        Content-Type:
          description: The MIME type of the body of the response.
          style: simple
          explode: false
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: ./definitions/SOL005VNFPackageManagement_def.yaml#/definitions/ExternalArtifactsAccessConfig

    IndividualVnfPackageExtArtifacts.Put.200:
      description: |
        200 OK
        Shall be returned when the attribute "onboardingState" = "CREATED" or when the attribute "onboardingState" = "ERROR"
        and the VNF package has not been uploaded successfully previously, to indicate that the access configuration information
        has been stored successfully by the NFVO. The response body shall contain a representation of the state of the resource.
      headers:
        Version:
          description: |
            Version of the API used in the response.
          style: simple
          explode: false
          schema:
            type: string
        WWW-Authenticate:
          description: |
            Challenge if the corresponding HTTP request has not provided authorization, or error details if the
            corresponding HTTP request has provided an invalid authorization token.
          style: simple
          explode: false
          schema:
            type: string
        Content-Type:
          description: The MIME type of the body of the response.
          style: simple
          explode: false
          schema:
            type: string
        ETag:
          description: |
            Etag used in the header response.
          style: simple
          explode: false
          schema:
            type: string
        Last-Modified:
          description: |
            Last-modified used in the header response.
          style: simple
          explode: false
          schema:
            type: string
        If-Unmodified-Since:
          description: |
            Response header available in case the related "Last-Modified" or "ETag" headers 
            have been received in previous responses related to the target resource. 
            The API consumer should provide the "If-Unmodified-Since" or the "If-Match" header fields 
            as conditions (see sections 3.1 and 3.4 of IETF RFC 9110). 
          style: simple
          explode: false
          schema:
              type: string
        If-Match:
          description: |
            Response header available in case the related "Last-Modified" or "ETag" headers 
            have been received in previous responses related to the target resource. 
            The API consumer should provide the "If-Unmodified-Since" or the "If-Match" header fields 
            as conditions (see sections 3.1 and 3.4 of IETF RFC 9110). 
          style: simple
          explode: false
          schema:
              type: string
      content:
        application/json:
          schema:
            $ref: ./definitions/SOL005VNFPackageManagement_def.yaml#/definitions/ExternalArtifactsAccessConfig

    IndividualVnfPackageExtArtifacts.Put.202:
      description: |
        202 ACCEPTED

        "onboardingState" = "ERROR" and the VNF package has been uploaded successfully previously, to indicate that
        the access configuration information has been stored successfully by the NFVO and the NFVO now starts downloading external artifacts.
        The response body shall be empty.
        Prior to returning the 202 response, the NFVO shall set the "onboardingState" attribute to "UPLOADING".
        Subsequently to returning the 202 response, the NFVO shall retry the download of those external artifacts
        that have failed downloading, or that were downloaded successfully previously and for which modified access configuration information has been provided in the request.
      headers:
        Version:
          description: |
            Version of the API used in the response.
          style: simple
          explode: false
          schema:
            type: string
        WWW-Authenticate:
          description: |
            Challenge if the corresponding HTTP request has not provided authorization, or error details if the
            corresponding HTTP request has provided an invalid authorization token.
          style: simple
          explode: false
          schema:
            type: string
        Content-Type:
          description: The MIME type of the body of the response.
          style: simple
          explode: false
          schema:
            type: string
        Location:
          description: The resource URI of the created NS instance
          style: simple
          explode: false
          schema:
            type: string
            format: url
      content: {}

    IndividualVnfPackageExtArtifacts.Put.409:
      description: |
        409 CONFLICT

        Shall be returned upon the following error: The operation cannot be executed currently, due to a
        conflict with the state of the resource.
        Typically, this is due to the fact that the "onboardingState" attribute contains a value different
        from "CREATED" or "ERROR".
        The response body shall contain a ProblemDetails structure, in which the "detail" attribute shall
        convey more information about the error.
      headers:
        Version:
          description: |
            Version of the API used in the response.
          style: simple
          explode: false
          schema:
            type: string
        WWW-Authenticate:
          description: |
            Challenge if the corresponding HTTP request has not provided authorization, or error details if the
            corresponding HTTP request has provided an invalid authorization token.
          style: simple
          explode: false
          schema:
            type: string
        Content-Type:
          description: The MIME type of the body of the response.
          style: simple
          explode: false
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "../definitions/SOL005_def.yaml#/definitions/ProblemDetails"

    IndividualVnfPackageManifest.Get.200:
      description: |
        200 OK
  
        Shall be returned when the content of the manifest has been read successfully. If the "include_signatures" URI query 
        parameter was absent in the request, or if the manifest file has all security-related information embedded (i.e. 

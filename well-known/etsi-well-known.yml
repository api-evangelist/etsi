  role: ETSI Forge GitLab (MEC, NFV SOL, CIM NGSI-LD OpenAPI source of truth)
  documents:
  - path: /.well-known/openid-configuration
    status: 200
    file: etsi-forge-openid-configuration.json
  - path: /.well-known/oauth-authorization-server

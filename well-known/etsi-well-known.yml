generated: '2026-07-25'
method: searched
source: live probes of every ETSI-operated host in apis.yml plus the OpenAPI servers[] hosts
notes: >-
  ETSI's own web estate (www.etsi.org, portal.etsi.org, try-mec.etsi.org, osl.etsi.org,
  ocf.etsi.org, mecwiki.etsi.org) publishes no /.well-known/ discovery surface at all.
  The discovery documents that DO exist sit on the two GitLab instances that host every
  machine-readable ETSI artefact (forge.etsi.org/rep and labs.etsi.org/rep, both anonymous
  OIDC providers and OAuth 2.0 authorization servers) and on the Keycloak realm in front of
  the public ETSI OpenSlice demo (portal.openslice.eu). No security.txt (RFC 9116) is published
  anywhere on etsi.org; ETSI's disclosure route is the Coordinated Vulnerability Disclosure
  page instead — see security/etsi-vulnerability-disclosure.yml.
hosts:

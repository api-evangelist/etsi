summary: >-
  There is no single ETSI data model. The corpus holds four independent entity graphs that share
  only a handful of primitive types. The most reused schema in the whole corpus is
  EventSubscription (1,047 references) — a fair summary of what ETSI's API work actually is:
  subscribe to a network resource and get told when it changes. ProblemDetails (559 references)
  is the second most reused, which is why the RFC 7807/9457 error shape is the one convention
  that does hold across families.
